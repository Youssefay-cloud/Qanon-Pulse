services:
  db:
    container_name: qanonpulse_db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: yoyo
      POSTGRES_DB: qanon_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d qanon_db"]
      interval: 3s
      timeout: 3s
      retries: 10


  pgadmin:
    image: dpage/pgadmin4:9
    container_name: qanonpulse_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: yoyo
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  # Notice the correct indentation here (2 spaces)
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      - DATA_FILE_PATH=/data/reshaped_laws.json
      - DATABASE_URL=postgresql+psycopg2://root:yoyo@db:5432/qanon_db
    volumes:
      - ./data:/data
    depends_on:
      db :
        condition: service_healthy
    profiles: ["manual"]    

  
  transform:
    build: 
      context: .
      dockerfile: transform/Dockerfile
    command: >
      sh -c "python -m transform.split_articles &&
             python -m transform.metrics_structure &&
             python -m transform.metrics_text &&
             python -m transform.metrics_terms"
    environment:
      - DATABASE_URL=postgresql+psycopg2://root:yoyo@db:5432/qanon_db
    depends_on:
      ingestion:
        condition: service_completed_successfully
    volumes:
      - ./transform:/code/transform
    profiles: ["manual"]    



  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard/data:/code/dashboard/data


  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: airflow standalone
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DATABASE_URL: postgresql+psycopg2://root:yoyo@db:5432/qanon_db
      DATA_FILE_PATH: /data/reshaped_laws.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./transform:/home/airflow/project/transform
      - ./ingestion:/home/airflow/project/ingestion
      - ./data:/data
      - ./dashboard/data:/home/airflow/project/dashboard/data
    depends_on:
      db:
        condition: service_healthy

# Clean, default volumes
volumes:
  postgres_data:
  pgadmin_data: