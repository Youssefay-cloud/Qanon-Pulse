services:
  db:
    container_name: qanonpulse_db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: yoyo
      POSTGRES_DB: qanon_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: qanonpulse_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: yoyo
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  # Notice the correct indentation here (2 spaces)
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      - DATA_FILE_PATH=/data/reshaped_laws.json
      - DATABASE_URL=postgresql+psycopg2://root:yoyo@db:5432/qanon_db
    volumes:
      - ./data:/data
    depends_on:
      - db
    restart: on-failure  # <--- Added this so it retries if DB isn't ready yet
  
  transform:
    build: 
      context: .
      dockerfile: transform/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg2://root:yoyo@db:5432/qanon_db
    depends_on:
      - db
# Clean, default volumes
volumes:
  postgres_data:
  pgadmin_data: